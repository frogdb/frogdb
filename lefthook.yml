min_version: 1.10.0

pre-commit:
  parallel: true
  jobs:
    - name: rust
      group:
        piped: true
        jobs:
          - name: rust-fmt
            glob:
              - "**/*.rs"
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
            run: just fmt-check
          - name: rust-clippy
            glob:
              - "**/*.rs"
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
            # Cold clippy + the failure-modes listing run 10+ minutes — longer than the
            # agent harness command timeout, which historically forced agents into blanket
            # `git commit --no-verify`, skipping every hook including the fast ones. Agents
            # are required to run `just lint` as a pre-push verification step instead
            # (docs/agents/hardening-campaign.md), so the commit-time job is skipped for
            # them; human commits from a terminal run it unchanged.
            run: |
              if [ "${CLAUDECODE:-}" = "1" ]; then
                echo "rust-clippy: skipped under Claude Code (agents must run 'just lint' before pushing)"
              else
                just lint
              fi
    - name: python
      group:
        parallel: true
        jobs:
          - name: python-fmt
            glob: "**/*.py"
            run: just fmt-py-check
          - name: python-lint
            glob: "**/*.py"
            run: just lint-py
    - name: toolchain-drift
      glob:
        - "rust-toolchain.toml"
        - ".mise.toml"
      run: just sync-toolchain-check
    - name: no-typed-unwrap
      glob:
        - "frogdb-server/crates/commands/src/**/*.rs"
      run: just lint-no-typed-unwrap
    - name: keyspace-notify-routing
      glob:
        - "frogdb-server/crates/core/src/shard/**/*.rs"
      run: just lint-keyspace-notify-routing
    - name: script-gate
      glob:
        - "frogdb-server/crates/core/src/scripting/**/*.rs"
      run: just lint-script-gate
    - name: scratch-tracker
      glob:
        - ".scratch/**/*.md"
      run: just scratch-check
