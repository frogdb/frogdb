min_version: 1.10.0

pre-commit:
  parallel: true
  jobs:
    - name: rust
      group:
        piped: true
        jobs:
          - name: rust-fmt
            glob:
              - "**/*.rs"
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
            run: just fmt-check
          - name: rust-clippy
            glob:
              - "**/*.rs"
              - "Cargo.toml"
              - "**/Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".cargo/**"
            # Cold clippy + the failure-modes listing run 10+ minutes — longer than the
            # agent harness command timeout, which historically forced agents into blanket
            # `git commit --no-verify`, skipping every hook including the fast ones. Agents
            # are required to run `just lint` as a pre-push verification step instead
            # (docs/agents/hardening-campaign.md), so the commit-time job is skipped for
            # them; human commits from a terminal run it unchanged.
            run: |
              if [ "${CLAUDECODE:-}" = "1" ]; then
                echo "rust-clippy: skipped under Claude Code (agents must run 'just lint' before pushing)"
              else
                just lint
              fi
    - name: python
      group:
        parallel: true
        jobs:
          - name: python-fmt
            glob: "**/*.py"
            run: just fmt-py-check
          - name: python-lint
            glob: "**/*.py"
            run: just lint-py
    - name: toolchain-drift
      glob:
        - "rust-toolchain.toml"
        - ".mise.toml"
      run: just sync-toolchain-check
    # The compile-free seam-lint family (docs/agents/seam-lints.md). Unlike
    # rust-clippy above, these are grep/regex checks with no compile step
    # (sub-second total), so there is no CLAUDECODE skip: the rationale for
    # skipping clippy under agents does not apply to a set of greps. Runs
    # unconditionally (no glob) since a violation can be introduced by
    # editing either the checked file or the seam it must route through.
    - name: seam-gates
      run: just lint-gates
    - name: scratch-tracker
      glob:
        - ".scratch/**/*.md"
      run: just scratch-check
