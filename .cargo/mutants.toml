# cargo-mutants configuration for the locked core areas
# (see CLAUDE.md "Locked core areas"). Run via `just mutants <crate>` /
# `just mutants-diff <crate>`; scores enforced by `just mutants-gate`.

test_tool = "nextest"

# Cluster/replication integration tests are legitimately slow; give mutant
# test runs generous headroom so slow-but-caught mutants don't count as
# timeouts (a rising timeout share means this multiplier is wrong, not that
# the tests are bad — see scripts/mutants-gate.py).
timeout_multiplier = 4.0
minimum_test_timeout = 60.0

exclude_globs = [
    "**/tests/**",
    "**/benches/**",
    "frogdb-server/crates/redis-regression/**",
    "frogctl/**",
]

# Never mutate observability plumbing: a survivor there is noise, not a
# correctness gap. Patterns match cargo-mutants' mutant names, which use
# fully-qualified forms like `<impl std::fmt::Display for X>::fmt` and
# `Type::record_gauge`.
#
# The metric sinks are named individually rather than as a `::record_` prefix:
# that prefix also swallowed real state machines whose method names happen to
# start the same way — `FlushOutcomes::record_success` (the committed-vs-synced
# watermark split, FM-PERSISTENCE-043), `SnapshotStats::record_failure`
# (FM-PERSISTENCE-022), `RocksStore::record_wal_watermark` (FM-PERSISTENCE-035),
# `FailureDetector::record_success`. Excluding those is not noise reduction, it
# is a blind spot in the middle of the specced behavior.
exclude_re = [
    # `FeedSequencer::step`'s explicit (Sending, Sent{lag_breached:true} |
    # SendFailed) arm is behaviorally identical to the `_ => end(Lost)` fence
    # that follows it — the arm exists to *name* the driver-reachable failure
    # inputs, so deleting it is an equivalent mutant no test can kill (see the
    # comment at the arm). Only this one arm-deletion is excluded; every other
    # `step` mutation stays in scope.
    "delete match arm \\(Stage::Sending, FeedInput::Sent\\{lag_breached:true\\}\\) \\|\\(Stage::Sending, FeedInput::SendFailed\\) in FeedSequencer::step",
    # `CfTier::label` exists only to name the tier in two `error!` fields; no
    # caller branches on it.
    "CfTier::label",
    "::record_gauge",
    "::record_histogram",
    "::record_command_latency_ms",
    "::metric_label",
    "impl std::fmt::Debug",
    "impl std::fmt::Display",
    "impl Debug",
    "impl Display",
]
