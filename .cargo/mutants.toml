# cargo-mutants configuration for the locked core areas
# (see CLAUDE.md "Locked core areas"). Run via `just mutants <crate>` /
# `just mutants-diff <crate>`; scores enforced by `just mutants-gate`.

test_tool = "nextest"

# Cluster/replication integration tests are legitimately slow; give mutant
# test runs generous headroom so slow-but-caught mutants don't count as
# timeouts (a rising timeout share means this multiplier is wrong, not that
# the tests are bad — see scripts/mutants-gate.py).
timeout_multiplier = 4.0
minimum_test_timeout = 60.0

exclude_globs = [
    "**/tests/**",
    "**/benches/**",
    "frogdb-server/crates/redis-regression/**",
    "frogctl/**",
]

# Never mutate observability plumbing: a survivor there is noise, not a
# correctness gap. Patterns match cargo-mutants' mutant names, which use
# fully-qualified forms like `<impl std::fmt::Display for X>::fmt` and
# `Type::record_gauge`.
#
# The metric sinks are named individually rather than as a `::record_` prefix:
# that prefix also swallowed real state machines whose method names happen to
# start the same way — `FlushOutcomes::record_success` (the committed-vs-synced
# watermark split, FM-PERSISTENCE-043), `SnapshotStats::record_failure`
# (FM-PERSISTENCE-022), `RocksStore::record_wal_watermark` (FM-PERSISTENCE-035),
# `FailureDetector::record_success`. Excluding those is not noise reduction, it
# is a blind spot in the middle of the specced behavior.
exclude_re = [
    # `FeedSequencer::step`'s explicit (Sending, Sent{lag_breached:true} |
    # SendFailed) arm is behaviorally identical to the `_ => end(Lost)` fence
    # that follows it — the arm exists to *name* the driver-reachable failure
    # inputs, so deleting it is an equivalent mutant no test can kill (see the
    # comment at the arm). Only this one arm-deletion is excluded; every other
    # `step` mutation stays in scope.
    "delete match arm \\(Stage::Sending, FeedInput::Sent\\{lag_breached:true\\}\\) \\|\\(Stage::Sending, FeedInput::SendFailed\\) in FeedSequencer::step",
    # `CfTier::label` exists only to name the tier in two `error!` fields; no
    # caller branches on it.
    "CfTier::label",
    # `ShardCoverage::none()` returns the empty vector, which is exactly what
    # the type's derived `Default` returns — so replacing the body with
    # `Default::default()` is an equivalent mutant no observation can kill (see
    # the comment at the constructor, FM-REPLICATION-066). Only this one
    # substitution is excluded; every other `ShardCoverage` mutation stays in
    # scope.
    "replace ShardCoverage::none -> Self with Default::default\\(\\)",
    # `FlushHold::shared` wraps `Self::new()`, which is verbatim what the
    # `Default` impl forwards to, so swapping in `Default::default()` is an
    # equivalent mutant (see the comment at the constructor). Only this one
    # substitution is excluded; every other `FlushHold` mutation stays in scope.
    "replace FlushHold::shared -> Arc<Self> with Arc::new\\(Default::default\\(\\)\\)",
    # `arm` keeps the *later* of the two deadlines. `>` and `>=` select the same
    # instant when the two are equal, so this one relaxation is equivalent; the
    # other four mutations of the same comparison are killed by
    # `a_later_arm_never_shortens_the_deadline` / `a_later_deadline_extends_the_hold`.
    "replace > with >= in FlushHold::arm",
    # `FlushEngine::forget_flush_hold` guards a path flume cannot produce: the
    # post-disconnect `try_recv` drain is the only remaining hold-consulting
    # site, and `Disconnected` is only returned for an *empty* closed channel
    # (see the comment at the method). Unobservable, kept as depth-in-defence.
    "replace FlushEngine<S>::forget_flush_hold with \\(\\)",
    # `ProcessExitFailStop::fail_stop` ends the process. No test can observe a
    # mutant of a body whose unmutated effect is killing the test runner, so
    # every mutation of it is unkillable by construction (see the comment at the
    # impl). The *decision* to call a sink — write escalates, read does not — is
    # what the FM-VLL-005 forcing tests pin, and those mutate freely in
    # `VllShardState::release_after_panic`.
    "ProcessExitFailStop::fail_stop",
    "::record_gauge",
    "::record_histogram",
    "::record_command_latency_ms",
    "::metric_label",
    "impl std::fmt::Debug",
    "impl std::fmt::Display",
    "impl Debug",
    "impl Display",
]
