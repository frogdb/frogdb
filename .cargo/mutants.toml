# cargo-mutants configuration for the hardening campaign
# (docs/agents/hardening-campaign.md). Run via `just mutants <crate>` /
# `just mutants-diff <crate>`; scores enforced by `just mutants-gate`.

test_tool = "nextest"

# Cluster/replication integration tests are legitimately slow; give mutant
# test runs generous headroom so slow-but-caught mutants don't count as
# timeouts (a rising timeout share means this multiplier is wrong, not that
# the tests are bad — see scripts/mutants-gate.py).
timeout_multiplier = 4.0
minimum_test_timeout = 60.0

exclude_globs = [
    "**/tests/**",
    "**/benches/**",
    "frogdb-server/crates/redis-regression/**",
    "frogctl/**",
]

# Never mutate observability plumbing: a survivor there is noise, not a
# correctness gap. Patterns match cargo-mutants' mutant names, which use
# fully-qualified forms like `<impl std::fmt::Display for X>::fmt` and
# `Type::record_outcome`.
exclude_re = [
    "::record_",
    "::metric_label",
    "impl std::fmt::Debug",
    "impl std::fmt::Display",
    "impl Debug",
    "impl Display",
]
