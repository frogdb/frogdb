[package]
name = "docs-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Documentation data generator for FrogDB — extracts config defaults and schema"
publish = false

[[bin]]
name = "docs-gen"
path = "src/main.rs"

[dependencies]
frogctl = { path = "../../../frogctl" }
frogdb-config.workspace = true
frogdb-core.workspace = true
# docs-gen enumerates the production command registry to emit the website's
# commands.json (and, downstream, the compat matrix). A core-profile build would
# silently truncate that list, so it always asks for the full command surface.
frogdb-server = { path = "../../crates/server", features = ["cmd-full"] }
frogdb-telemetry = { path = "../../crates/telemetry" }
frogdb-types.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
clap.workspace = true
anyhow.workspace = true
