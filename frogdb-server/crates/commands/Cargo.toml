[package]
name = "frogdb-commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Data-structure command implementations for FrogDB"

# Command families are feature-gated so a targeted core-area build/test cycle can
# skip the exotic ones (see docs/agents/hardening-campaign.md). `default` keeps
# the always-compiled campaign surface; `full` restores the complete command set
# and is what every registry-enumerating consumer (docs-gen, the frozen
# redis-regression suite, the shard-driver harness) must depend on.
[features]
default = ["core-profile"]
# Always-compiled campaign surface: basic, string, bitmap, list, hash, set,
# sorted_set, expiry, blocking, scan, generic, sort, utils.
core-profile = []
json = []
timeseries = []
bloom = []
cuckoo = []
cms = []
topk = []
tdigest = []
geo = []
vectorset = []
hyperloglog = []
stream = []
event-sourcing = []
full = [
    "core-profile",
    "json",
    "timeseries",
    "bloom",
    "cuckoo",
    "cms",
    "topk",
    "tdigest",
    "geo",
    "vectorset",
    "hyperloglog",
    "stream",
    "event-sourcing",
]

[dependencies]
frogdb-core.workspace = true
frogdb-protocol.workspace = true
bytes.workspace = true
rand.workspace = true
serde_json.workspace = true
tracing.workspace = true
bitvec.workspace = true
ryu.workspace = true
xxhash-rust.workspace = true
hex.workspace = true
smallvec.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
