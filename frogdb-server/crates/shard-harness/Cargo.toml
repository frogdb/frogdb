[package]
name = "frogdb-shard-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Deterministic shard-worker driver harness against the real command set"
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

[dependencies]
# Enables the test-only public seam surface (drive* wrapper methods on
# ShardWorker, ShardReceiver::try_recv, FakeWalSink) this harness drives.
frogdb-core = { workspace = true, features = ["shard-driver", "fake-wal"] }
frogdb-commands.workspace = true
frogdb-protocol.workspace = true
frogdb-vll.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
proptest.workspace = true
