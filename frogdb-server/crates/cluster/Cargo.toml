[package]
name = "frogdb-cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Raft-based cluster coordination for FrogDB"

[dependencies]
frogdb-protocol.workspace = true
frogdb-types.workspace = true
openraft.workspace = true
rocksdb.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
semver = "1"
thiserror.workspace = true

[features]
test-utils = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
tempfile.workspace = true
proptest.workspace = true
tracing-subscriber = { workspace = true, features = ["registry"] }
stateright.workspace = true
quint-connect = "0.1.2"
# quint-connect's `State::from_spec` takes an `itf::Value` — named directly so
# `ScriptedProj`'s override (frogdb-cluster's own `.fail()`-run + ghost-field
# handling, tests/quint_conformance.rs) can pattern-match on it. Pinned to the
# same version quint-connect 0.1.2 already pulls in transitively.
itf = "0.4.0"
anyhow.workspace = true
