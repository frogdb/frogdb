[package]
name = "frogdb-types"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared type foundation for FrogDB — value types, errors, traits, and utilities"

[features]
shuttle = ["dep:shuttle"]

[dependencies]
frogdb-metrics-derive.workspace = true
frogdb-protocol.workspace = true
bytes.workspace = true
ordered-float.workspace = true
bitvec.workspace = true
thiserror.workspace = true
tracing.workspace = true
murmur3.workspace = true
xxhash-rust.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
smallvec.workspace = true
usearch.workspace = true
shuttle = { workspace = true, optional = true }
# `time` only: the expiry domain reads its monotonic clock through tokio so it
# follows a paused runtime's timer (see `crate::clock`).
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
proptest.workspace = true
# `rt`/`macros`/`test-util`: `clock::system_now` tests drive a paused runtime
# via `#[tokio::test(start_paused = true)]` + `tokio::time::advance`.
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
