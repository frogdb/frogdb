[package]
name = "frogdb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FrogDB server binary"
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

# Cluster integration tests, split per concern out of the former
# `tests/integration_cluster.rs` (hardening campaign Phase 4). Kept as separate
# binaries rather than `main` modules so nextest can target them as a group
# (`binary(/^cluster_/)` — see `.config/nextest.toml` and `just core-test-e2e
# cluster`). Each file is `#![cfg(not(feature = "turmoil"))]`, matching the gate
# the module carried in `tests/main.rs`.
[[test]]
name = "cluster_topology"
path = "tests/cluster_topology.rs"

[[test]]
name = "cluster_slots"
path = "tests/cluster_slots.rs"

[[test]]
name = "cluster_migration"
path = "tests/cluster_migration.rs"

[[test]]
name = "cluster_failover"
path = "tests/cluster_failover.rs"

[[test]]
name = "cluster_misc"
path = "tests/cluster_misc.rs"

# Slot-scoped pause barrier (rework issue 02, phase 1): FM-CLUSTER-079..083.
[[test]]
name = "cluster_pause_barrier"
path = "tests/cluster_pause_barrier.rs"

# Two-phase slot-handoff finalization (rework issue 02, phase 2a):
# FM-CLUSTER-084..092.
[[test]]
name = "cluster_handoff_barrier"
path = "tests/cluster_handoff_barrier.rs"

# Measurement harness for rework issue 02 (slot-migration finalization residual
# window). Every case is `#[ignore]`d — it records latencies rather than
# asserting, so it never runs as part of `just test`.
[[test]]
name = "cluster_finalization_window"
path = "tests/cluster_finalization_window.rs"

# Real-thread arena reading (memory-architecture issue 09). Its own binary
# because it declares `#[global_allocator] Jemalloc`: the bytes it asserts on
# have to reach a real jemalloc arena, and that requirement belongs to these
# two tests rather than to every unit test in the crate.
[[test]]
name = "arena_reading"
path = "tests/arena_reading.rs"

[[bin]]
name = "frogdb-server"
path = "src/main.rs"

[features]
default = ["cmd-core"]
shuttle = ["dep:shuttle", "frogdb-core/shuttle"]
# The turmoil simulation harness drives streams (XADD/XREADGROUP/XPENDING/…)
# through `common::sim_harness`'s canonicalizer and `simulation.rs`'s
# round-trip cases, so the stream family has to be compiled in whenever the
# simulation tests are built. No other exotic family appears in the sim suite.
turmoil = ["dep:turmoil", "frogdb-cluster-runtime/turmoil", "frogdb-config/turmoil", "frogdb-net/turmoil", "frogdb-core/fake-wal", "frogdb-core/wait-queue-log", "frogdb-core/shard-driver", "cmd-stream"]
causal-profile = ["dep:tokio-coz"]
profiling = ["dep:tracing-flame"]

# Command-family mirrors of `frogdb-commands`' feature set (see that crate's
# lib.rs). `cmd-core` is a marker: `frogdb-commands`' own default already is
# `core-profile`, so the default server build compiles the always-on families
# and nothing else. `cmd-full` restores the complete command surface and is
# what every registry-enumerating consumer must ask for.
cmd-core = []
cmd-json = ["frogdb-commands/json"]
cmd-timeseries = ["frogdb-commands/timeseries"]
cmd-bloom = ["frogdb-commands/bloom"]
cmd-cuckoo = ["frogdb-commands/cuckoo"]
cmd-cms = ["frogdb-commands/cms"]
cmd-topk = ["frogdb-commands/topk"]
cmd-tdigest = ["frogdb-commands/tdigest"]
cmd-geo = ["frogdb-commands/geo"]
cmd-vectorset = ["frogdb-commands/vectorset"]
cmd-hyperloglog = ["frogdb-commands/hyperloglog"]
cmd-stream = ["frogdb-commands/stream"]
cmd-event-sourcing = ["frogdb-commands/event-sourcing"]
cmd-full = [
    "frogdb-commands/full",
    "cmd-core",
    "cmd-json",
    "cmd-timeseries",
    "cmd-bloom",
    "cmd-cuckoo",
    "cmd-cms",
    "cmd-topk",
    "cmd-tdigest",
    "cmd-geo",
    "cmd-vectorset",
    "cmd-hyperloglog",
    "cmd-stream",
    "cmd-event-sourcing",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
frogdb-cluster.workspace = true
frogdb-cluster-runtime.workspace = true
frogdb-config.workspace = true
frogdb-protocol.workspace = true
frogdb-core.workspace = true
frogdb-vll.workspace = true
frogdb-txn.workspace = true
frogdb-recovery.workspace = true
frogdb-debug.workspace = true
frogdb-replication.workspace = true
frogdb-replication-runtime.workspace = true
frogdb-commands.workspace = true
frogdb-search.workspace = true
frogdb-telemetry.workspace = true
frogdb-memory.workspace = true
frogdb-net.workspace = true
async-trait.workspace = true
bytes.workspace = true
rand.workspace = true
tokio.workspace = true
tokio-util.workspace = true
redis-protocol.workspace = true
figment.workspace = true
dashmap.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
rolling-file.workspace = true
thiserror.workspace = true
anyhow.workspace = true
futures.workspace = true
bitvec.workspace = true
crc16.workspace = true
sha2.workspace = true
hex.workspace = true
shuttle = { workspace = true, optional = true }
turmoil = { workspace = true, optional = true }
tokio-coz = { workspace = true, optional = true }
tokio-metrics = { workspace = true }
tracing-flame = { workspace = true, optional = true }
semver = "1"
openraft.workspace = true
axum.workspace = true
tower.workspace = true
schemars.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
arc-swap.workspace = true
rustls-pemfile.workspace = true
x509-parser.workspace = true
webpki-roots.workspace = true
pin-project-lite.workspace = true
toml_edit.workspace = true
toml.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6"
hyper = { version = "1", features = ["http1", "server"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }

[dev-dependencies]
socket2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
futures.workspace = true
shuttle.workspace = true
turmoil.workspace = true
tempfile.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
proptest.workspace = true
frogdb-testing.workspace = true
frogdb-test-harness.workspace = true
# The shared simulation scheduler (tests/simulation/schedule.rs) is typed over
# the invariant vocabulary rather than over any one arm's crate.
frogdb-types.workspace = true
rstest = "0.26"
frogdb-telemetry = { workspace = true, features = ["testing"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
# `aws_lc_rs` unlocks RSA key generation (the default `ring` backend cannot
# generate RSA keys), needed by the dual-cert resolver tests. aws-lc-sys is
# already in the tree via rustls, so this adds no new native build.
rcgen = { workspace = true, features = ["aws_lc_rs"] }
sha1.workspace = true
# Enable RocksStore's test-only single-key put accessor (re-exported through
# frogdb_core::persistence) so integration tests can synthesize a data
# directory's on-disk state directly, without a prior server boot. Dev-only,
# kept out of the production build by resolver "2" — mirrors frogdb-core's,
# frogdb-recovery's, and frogdb-replication's own dev-dependency.
frogdb-persistence = { workspace = true, features = ["test-support"] }
