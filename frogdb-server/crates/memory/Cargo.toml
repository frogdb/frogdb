[package]
name = "frogdb-memory"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Per-core memory broker and the Budget handle every non-keyspace buffer charges before it grows"

# Deliberately dependency-free (not even frogdb-types). The broker is pure
# accounting: it must be constructible in a unit test with no runtime, no
# metrics recorder and no allocator, and it must not become a place where a
# crate cycle can form. Emission of the breakdown as metrics belongs to the
# caller that already holds a recorder (see `frogdb-core`'s shard diagnostics).
[dependencies]
