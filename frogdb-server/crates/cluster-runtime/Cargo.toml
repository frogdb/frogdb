[package]
name = "frogdb-cluster-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Server-side cluster runtime: cluster bus, cross-node pub/sub, live cluster flags, failure detection"

[features]
default = []
# Swap the TCP primitives for turmoil's simulated network. Enabled through
# frogdb-server's `turmoil` feature, which must forward
# `frogdb-cluster-runtime/turmoil` — `just lint-turmoil-features` enforces both
# this declaration and the forward.
turmoil = ["frogdb-net/turmoil", "frogdb-config/turmoil"]

[dependencies]
frogdb-config.workspace = true
frogdb-core.workspace = true
frogdb-net.workspace = true
bytes.workspace = true
openraft.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
