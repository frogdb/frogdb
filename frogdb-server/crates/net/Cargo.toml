[package]
name = "frogdb-net"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
authors.workspace = true
repository.workspace = true
description = "Turmoil-swappable network primitives for FrogDB"

[features]
default = []
# Swap the TCP primitives for turmoil's simulated network. Enabled through
# frogdb-server's `turmoil` feature (which must forward `frogdb-net/turmoil` —
# `just lint-turmoil-features` enforces that); never in production.
turmoil = ["dep:turmoil"]

[dependencies]
tokio.workspace = true
socket2.workspace = true
tracing.workspace = true
turmoil = { workspace = true, optional = true }

# Shard-thread CPU pinning (`sched_setaffinity`). Linux-only on purpose: macOS
# exposes no strict affinity API, so there is nothing to link against there.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
