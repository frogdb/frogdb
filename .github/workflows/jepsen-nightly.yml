name: Jepsen Nightly
'on':
  schedule:
  - cron: '37 5 * * *'
  workflow_dispatch:
    inputs:
      suites:
        description: Space-separated run.py suites to run (e.g. 'raft replication'), or 'full' for core plus the extended/fault suites. Empty = core suites.
        required: false
        default: ''
        type: string
jobs:
  gate:
    name: Change Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
    - id: gate
      name: Check for new commits since last successful run
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        CURRENT_SHA: ${{ github.sha }}
        WORKFLOW_FILE: jepsen-nightly.yml
      run: |
        set -uo pipefail
        if [ "${EVENT_NAME}" != "schedule" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a scheduled run (event: ${EVENT_NAME}); proceeding."
          exit 0
        fi
        last_sha=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_FILE}" \
          --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
        if [ -z "${last_sha}" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No previous successful run found; proceeding."
        elif [ "${last_sha}" = "${CURRENT_SHA}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No new commits since last successful run (${last_sha}); skipping."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "New commits since last successful run (${last_sha} -> ${CURRENT_SHA}); proceeding."
        fi
  jepsen-nightly:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: Nightly Jepsen Distributed-Correctness Suites
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: just uv java
        cache: 'true'
        experimental: 'true'
    - name: Install Leiningen
      run: |
        if command -v lein >/dev/null 2>&1; then
          echo "lein already present: $(command -v lein)"
          exit 0
        fi
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
          -o "$HOME/.local/bin/lein"
        chmod +x "$HOME/.local/bin/lein"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        lein version
    - name: Install gnuplot
      run: |
        if command -v gnuplot >/dev/null 2>&1; then
          echo "gnuplot already present: $(command -v gnuplot)"
          exit 0
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq gnuplot-nox
        gnuplot --version
    - name: Build debug Docker image
      run: |
        just docker-build-debug
    - name: Run Jepsen suites
      env:
        SUITES_INPUT: ${{ github.event.inputs.suites }}
        FULL_KEYWORD: full
        CORE_SUITES: single crash replication raft
        FULL_SUITES: single crash replication raft raft-extended replication-extended register-fault
      run: |
        set -uo pipefail
        if [ "${SUITES_INPUT}" = "${FULL_KEYWORD}" ]; then
          suites="${FULL_SUITES}"
        elif [ -n "${SUITES_INPUT}" ]; then
          suites="${SUITES_INPUT}"
        else
          suites="${CORE_SUITES}"
        fi
        echo "Running Jepsen suites: ${suites}"

        rc_total=0
        for suite in ${suites}; do
          echo "::group::Jepsen suite: ${suite}"
          # --no-build: the image was built once by the previous step; never let
          # run.py fall back to its host cross/zigbuild path here.
          if uv run testing/jepsen/run.py run \
               --suite "${suite}" --no-build --teardown --no-color; then
            echo "suite ${suite}: OK"
          else
            rc=$?
            echo "suite ${suite}: FAILED (run.py exit ${rc})"
            rc_total=1
          fi
          echo "::endgroup::"
        done
        exit ${rc_total}
    - name: Jepsen summary
      if: always()
      run: |
        just jepsen-summary | tee /tmp/jepsen-summary.txt || true
        {
          echo '### Jepsen nightly results'
          echo '```'
          cat /tmp/jepsen-summary.txt 2>/dev/null || echo '(no summary produced)'
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Tar jepsen store
      if: failure()
      run: |
        # Jepsen's independent-checker directories contain colons
        # (store/.../independent/:f1/...), which upload-artifact
        # rejects for NTFS compatibility. Ship one tarball instead.
        if [ -d "testing/jepsen/frogdb/store" ]; then
          tar -czf /tmp/jepsen-store.tgz -C "testing/jepsen/frogdb/store" .
        else
          echo "no store directory; nothing to tar"
        fi
    - name: Upload jepsen-store
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: jepsen-store
        path: /tmp/jepsen-store.tgz
        retention-days: '7'
