name: Fuzz
env:
  CARGO_TERM_COLOR: always
'on':
  schedule:
  - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: Per-target fuzzing budget in seconds for the campaign (default 180).
        required: false
        default: '180'
        type: string
  pull_request:
    branches:
    - main
jobs:
  gate:
    name: Change Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
    - id: gate
      name: Check for new commits since last successful run
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        CURRENT_SHA: ${{ github.sha }}
        WORKFLOW_FILE: fuzz.yml
      run: |
        set -uo pipefail
        if [ "${EVENT_NAME}" != "schedule" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a scheduled run (event: ${EVENT_NAME}); proceeding."
          exit 0
        fi
        last_sha=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_FILE}" \
          --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
        if [ -z "${last_sha}" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No previous successful run found; proceeding."
        elif [ "${last_sha}" = "${CURRENT_SHA}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No new commits since last successful run (${last_sha}); skipping."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "New commits since last successful run (${last_sha} -> ${CURRENT_SHA}); proceeding."
        fi
  fuzz-campaign:
    needs: gate
    if: github.event_name != 'pull_request' && needs.gate.outputs.skip != 'true'
    name: Fuzz Campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install Rust nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
    - name: Install libclang
      run: sudo apt-get install -y libclang-dev
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        shared-key: fuzz
    - name: Persist fuzz corpus
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: testing/fuzz/corpus
        key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: fuzz-corpus-
    - name: Run fuzz campaign
      env:
        FUZZ_SECONDS: ${{ github.event.inputs.duration || '180' }}
      run: |
        set -uo pipefail
        targets=$(cargo +nightly fuzz list --fuzz-dir testing/fuzz)
        rc=0
        for target in $targets; do
          echo "::group::Fuzzing $target for ${FUZZ_SECONDS}s"
          if cargo +nightly fuzz run "$target" --fuzz-dir testing/fuzz \
               -- -max_total_time="${FUZZ_SECONDS}"; then
            echo "$target: OK"
          else
            echo "$target: CRASH (reproducer in testing/fuzz/artifacts/$target)"
            rc=1
          fi
          echo "::endgroup::"
        done
        exit $rc
    - name: Upload fuzz-artifacts
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: fuzz-artifacts
        path: testing/fuzz/artifacts
        retention-days: '7'
        if-no-files-found: error
  corpus-replay:
    if: github.event_name == 'pull_request'
    name: Corpus Replay
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Install Rust nightly toolchain
      uses: dtolnay/rust-toolchain@nightly
    - name: Install libclang
      run: sudo apt-get install -y libclang-dev
    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      with:
        shared-key: fuzz
    - name: Restore fuzz corpus
      uses: actions/cache/restore@668228422ae6a00e4ad889ee87cd7109ec5666a7
      with:
        path: testing/fuzz/corpus
        key: fuzz-corpus-replay-${{ github.run_id }}
        restore-keys: fuzz-corpus-
    - name: Replay persisted corpus
      run: |
        set -uo pipefail
        targets=$(cargo +nightly fuzz list --fuzz-dir testing/fuzz)
        rc=0
        for target in $targets; do
          corpus_dir="testing/fuzz/corpus/$target"
          if [ ! -d "$corpus_dir" ] || [ -z "$(ls -A "$corpus_dir" 2>/dev/null)" ]; then
            echo "$target: no persisted corpus, skipping"
            continue
          fi
          echo "::group::Replaying corpus for $target"
          if cargo +nightly fuzz run "$target" --fuzz-dir testing/fuzz -- -runs=0; then
            echo "$target: OK"
          else
            echo "$target: REGRESSION (reproducer in testing/fuzz/artifacts/$target)"
            rc=1
          fi
          echo "::endgroup::"
        done
        exit $rc
    - name: Upload fuzz-artifacts
      if: failure()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: fuzz-artifacts
        path: testing/fuzz/artifacts
        retention-days: '7'
        if-no-files-found: error
