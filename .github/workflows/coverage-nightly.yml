name: Coverage Nightly
'on':
  schedule:
  - cron: '50 4 * * *'
  workflow_dispatch: {}
jobs:
  gate:
    name: Change Gate
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
    - id: gate
      name: Check for new commits since last successful scheduled run
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT_NAME: ${{ github.event_name }}
        CURRENT_SHA: ${{ github.sha }}
        WORKFLOW_FILE: coverage-nightly.yml
      run: |
        set -uo pipefail
        if [ "${EVENT_NAME}" != "schedule" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Not a scheduled run (event: ${EVENT_NAME}); proceeding."
          exit 0
        fi
        last_sha=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${WORKFLOW_FILE}" \
          --event schedule --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
        if [ -z "${last_sha}" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No previous successful scheduled run found; proceeding."
        elif [ "${last_sha}" = "${CURRENT_SHA}" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "No new commits since last successful scheduled run (${last_sha}); skipping."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "New commits since last successful scheduled run (${last_sha} -> ${CURRENT_SHA}); proceeding."
        fi
  coverage:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    name: Nightly Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      env:
        MISE_DISABLE_TOOLS: rust
      with:
        install: 'true'
        install_args: just cargo:cargo-nextest
        cache: 'true'
        experimental: 'true'
    - name: Install Rust 1.92.0
      uses: dtolnay/rust-toolchain@1.92.0
      with:
        components: llvm-tools-preview
    - name: Install libclang
      run: sudo apt-get install -y libclang-dev
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@80e6af7a2ec7f280fffe2d0a9d3a12a9d11d86e9
      with:
        tool: cargo-llvm-cov
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      with:
        shared-key: coverage
    - name: Generate coverage report
      run: just coverage-lcov
    - name: Coverage summary
      if: always()
      run: |
        set -uo pipefail
        if [ ! -f "target/llvm-cov/lcov.info" ]; then
          echo "### Coverage summary" >> "$GITHUB_STEP_SUMMARY"
          echo "lcov report not found at target/llvm-cov/lcov.info - coverage generation failed." \
            >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        # Sum line totals and count nonzero DA (line-hit) records in one pass.
        read -r lh lf da_total da_nonzero <<< "$(awk -F: '
          /^LH:/ { lh += $2 }
          /^LF:/ { lf += $2 }
          /^DA:/ { da_total++; split($2, a, ","); if (a[2] != 0) da_nonzero++ }
          END { print lh, lf, da_total, da_nonzero }
        ' target/llvm-cov/lcov.info)"
        pct=$(awk -v lh="$lh" -v lf="$lf" 'BEGIN { printf "%.1f", (lf > 0) ? (lh / lf * 100) : 0 }')
        ratio=$(awk -v n="$da_nonzero" -v t="$da_total" 'BEGIN { printf "%.4f", (t > 0) ? (n / t) : 0 }')
        cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
        ### Coverage summary

        Total line coverage: **${pct}%** (${lh}/${lf} lines)

        Nonzero-DA ratio: ${ratio} (${da_nonzero}/${da_total} line records executed)

        Baseline (2026-08-07, .scratch/testing-improvements/audit/coverage-summary.md): **86.6%**

        Per-crate baseline table and worst-file follow-up candidates (connection/builder.rs,
        config/loader.rs, core/src/store/mod.rs, admin/handlers.rs, etc.) are tracked in that
        same file - not required to be fixed as part of this job.
        SUMMARY
        # Structural-plausibility gate (issue 27): a report with lines but no hits
        # is worse than no report, because the number looks real. Fail loudly.
        implausible=$(awk -v lh="$lh" -v r="$ratio" -v floor="0.30" \
          'BEGIN { print (lh == 0 || r < floor) ? 1 : 0 }')
        if [ "$implausible" = "1" ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**FAILED plausibility check**: LH=${lh}, nonzero-DA ratio=${ratio} (floor 0.30)." \
            "The lcov carries essentially no test-execution data - treating this as a coverage" \
            "generation failure rather than publishing a meaningless number (issue 27)." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "::error::coverage report implausible: LH=${lh}, nonzero-DA ratio=${ratio} < 0.30" >&2
          exit 1
        fi
    - name: Upload coverage-lcov
      if: always()
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
      with:
        name: coverage-lcov
        path: target/llvm-cov/lcov.info
        retention-days: '7'
        if-no-files-found: error
