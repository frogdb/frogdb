  command-metadata-gen-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.python == 'true'
    name: Command Metadata Generation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: python uv just
        cache: 'true'
        experimental: 'true'
    - name: Check generated upstream metadata is up to date
      run: just command-metadata-gen-check
  docs-path-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.operator == 'true' || needs.changes.outputs.testing == 'true' || needs.changes.outputs.website == 'true'
    name: Docs Path Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: python uv just
        cache: 'true'
        experimental: 'true'
    - name: Check documentation code paths exist
      run: just docs-path-check
  workflow-gen-check:
    needs: changes
    if: needs.changes.outputs.workflow_gen == 'true'
    name: Workflow Generation Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: python uv just
        cache: 'true'
        experimental: 'true'
    - name: Check workflow files are up to date
      run: just workflow-gen --check
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    name: Python Lint & Format
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: python uv ruff
        cache: 'true'
        experimental: 'true'
    - name: Run ruff linter
      run: ruff check
    - name: Check ruff formatting
      run: ruff format --check
  helm-lint:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: helm
        cache: 'true'
        experimental: 'true'
    - name: Lint Helm chart
      run: helm lint frogdb-server/ops/deploy/helm/frogdb
    - name: Template Helm chart
      run: helm template frogdb frogdb-server/ops/deploy/helm/frogdb --debug
    - name: Template cluster preset
      run: helm template frogdb frogdb-server/ops/deploy/helm/frogdb -f frogdb-server/ops/deploy/helm/frogdb/values-cluster.yaml --debug
  ci-pass:
    needs:
    - actionlint
    - lint
    - seam-gates
    - quint
    - unit-tests
    - cmd-full-build
    - mutants-diff
    - shuttle-tests
    - turmoil-tests
    - operator-tests
    - helm-gen-check
    - dashboard-gen-check
    - dashboard-lint
    - docs-gen-check
    - compat-gen-check
    - spec-gen-check
    - matrix-gen-check
    - command-metadata-gen-check
    - docs-path-check
    - workflow-gen-check
    - python-lint
    - helm-lint
    if: always()
    name: CI Pass
    runs-on: ubuntu-latest
    steps:
    - name: Check results
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
