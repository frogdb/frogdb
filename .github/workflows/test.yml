  mutants-diff:
    needs: changes
    if: needs.changes.outputs.mutants_matrix != '[]'
    name: Mutation Ratchet (locked crates)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: mutants-diff-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ matrix.crate }}
      cancel-in-progress: true
    strategy:
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.mutants_matrix) }}
      fail-fast: false
    steps:
    - name: Checkout
