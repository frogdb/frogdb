    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - id: filter
      name: Check changed paths
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
      with:
        base: main
        filters: |
          rust:
            - 'frogdb-server/**'
            - 'frogctl/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - '.mise.toml'
            - '.cargo/**'
            - '.config/nextest.toml'
          operator:
            - 'frogdb-operator/**'
            - 'rust-toolchain.toml'
            - '.mise.toml'
          operator_config:
            - 'frogdb-server/crates/config/**'
            - 'frogdb-server/crates/config-derive/**'
            - 'frogdb-operator/Cargo.lock'
          workflows:
            - '.github/**'
          grafana:
            - 'frogdb-server/ops/grafana/**'
          helm:
            - 'frogdb-server/ops/deploy/helm/**'
          python:
            - '**/*.py'
          workflow_gen:
            - '.github/workflows/workflow_gen/**'
            - 'Justfile'
            - '.mise.toml'
            - 'rust-toolchain.toml'
          website:
            - 'website/**'
          specs:
            - 'specs/**'
            - 'website/scripts/spec-gen.py'
          quint:
            - 'specs/**'
            - 'Justfile'
            - '.mise.toml'
            - 'scripts/quint-*.sh'
          testing:
            - 'testing/**'
          locked-frogdb-cluster:
            - 'frogdb-server/crates/cluster/**'
          locked-frogdb-cluster-runtime:
            - 'frogdb-server/crates/cluster-runtime/**'
          locked-frogdb-persistence:
            - 'frogdb-server/crates/persistence/**'
          locked-frogdb-recovery:
            - 'frogdb-server/crates/recovery/**'
          locked-frogdb-replication:
            - 'frogdb-server/crates/replication/**'
          locked-frogdb-replication-runtime:
            - 'frogdb-server/crates/replication-runtime/**'
          locked-frogdb-txn:
            - 'frogdb-server/crates/txn/**'
          locked-frogdb-vll:
            - 'frogdb-server/crates/vll/**'
    - id: mutants-matrix
      name: Reduce locked-crate filters to a matrix
      env:
        LOCKED_FROGDB_CLUSTER: ${{ steps.filter.outputs['locked-frogdb-cluster'] }}
        LOCKED_FROGDB_CLUSTER_RUNTIME: ${{ steps.filter.outputs['locked-frogdb-cluster-runtime'] }}
        LOCKED_FROGDB_PERSISTENCE: ${{ steps.filter.outputs['locked-frogdb-persistence'] }}
        LOCKED_FROGDB_RECOVERY: ${{ steps.filter.outputs['locked-frogdb-recovery'] }}
        LOCKED_FROGDB_REPLICATION: ${{ steps.filter.outputs['locked-frogdb-replication'] }}
        LOCKED_FROGDB_REPLICATION_RUNTIME: ${{ steps.filter.outputs['locked-frogdb-replication-runtime'] }}
        LOCKED_FROGDB_TXN: ${{ steps.filter.outputs['locked-frogdb-txn'] }}
        LOCKED_FROGDB_VLL: ${{ steps.filter.outputs['locked-frogdb-vll'] }}
      run: |
        set -euo pipefail
        crates=()
        if [ "$LOCKED_FROGDB_CLUSTER" = "true" ]; then crates+=(frogdb-cluster); fi
        if [ "$LOCKED_FROGDB_CLUSTER_RUNTIME" = "true" ]; then crates+=(frogdb-cluster-runtime); fi
        if [ "$LOCKED_FROGDB_PERSISTENCE" = "true" ]; then crates+=(frogdb-persistence); fi
        if [ "$LOCKED_FROGDB_RECOVERY" = "true" ]; then crates+=(frogdb-recovery); fi
        if [ "$LOCKED_FROGDB_REPLICATION" = "true" ]; then crates+=(frogdb-replication); fi
        if [ "$LOCKED_FROGDB_REPLICATION_RUNTIME" = "true" ]; then crates+=(frogdb-replication-runtime); fi
        if [ "$LOCKED_FROGDB_TXN" = "true" ]; then crates+=(frogdb-txn); fi
        if [ "$LOCKED_FROGDB_VLL" = "true" ]; then crates+=(frogdb-vll); fi
        matrix=$(jq -cn '$ARGS.positional' --args ${crates[@]+"${crates[@]}"})
        echo "crates=$matrix" >> "$GITHUB_OUTPUT"
        echo "locked crates touched: $matrix"
