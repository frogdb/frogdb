name: Test
env:
  CARGO_TERM_COLOR: always
'on':
  workflow_dispatch: {}
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      operator: ${{ steps.filter.outputs.operator }}
      operator_config: ${{ steps.filter.outputs.operator_config }}
      workflows: ${{ steps.filter.outputs.workflows }}
      grafana: ${{ steps.filter.outputs.grafana }}
      helm: ${{ steps.filter.outputs.helm }}
      python: ${{ steps.filter.outputs.python }}
      workflow_gen: ${{ steps.filter.outputs.workflow_gen }}
      website: ${{ steps.filter.outputs.website }}
      specs: ${{ steps.filter.outputs.specs }}
      testing: ${{ steps.filter.outputs.testing }}
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - id: filter
      name: Check changed paths
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
      with:
        base: main
        filters: |
          rust:
            - 'frogdb-server/**'
            - 'frogctl/**'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - '.mise.toml'
            - '.cargo/**'
            - '.config/nextest.toml'
          operator:
            - 'frogdb-operator/**'
            - 'rust-toolchain.toml'
            - '.mise.toml'
          operator_config:
            - 'frogdb-server/crates/config/**'
            - 'frogdb-server/crates/config-derive/**'
            - 'frogdb-operator/Cargo.lock'
          workflows:
            - '.github/**'
          grafana:
            - 'frogdb-server/ops/grafana/**'
          helm:
            - 'frogdb-server/ops/deploy/helm/**'
          python:
            - '**/*.py'
          workflow_gen:
            - '.github/workflows/workflow_gen/**'
            - 'Justfile'
            - '.mise.toml'
            - 'rust-toolchain.toml'
          website:
            - 'website/**'
          specs:
            - 'specs/**'
            - 'website/scripts/spec-gen.py'
          testing:
            - 'testing/**'
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Run actionlint
      uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8
