    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
    - name: Set up mise toolchain
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        install: 'true'
        install_args: just cargo:cargo-deny
        cache: 'true'
        experimental: 'true'
    - name: Install Rust 1.92.0
      uses: dtolnay/rust-toolchain@1.92.0
      with:
        components: rustfmt, clippy
    - name: Install libclang
      run: sudo apt-get install -y libclang-dev
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      with:
        shared-key: stable
    - name: Check toolchain pins are consistent
      run: just sync-toolchain-check
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Check licenses and advisories
      run: cargo deny check --config frogdb-server/deny.toml
