[tool.ruff]
line-length = 100
target-version = "py311"

# Ruff discovers Markdown by default and rewrites fenced `python`/`py` blocks.
# Docs here are deliberate fragments (partial tuples, elided bodies), which the
# formatter rewrites into misleading-but-"valid" code, so keep Markdown out of
# ruff's file set. `force-exclude` makes the exclusion hold when a caller (editor,
# hook) passes a .md path explicitly.
# `.scratch` holds archived evidence scripts (e.g. mutation-battery drivers with
# byte-frozen pre-registration snapshots) that must never be reformatted or
# style-fixed after the fact.
extend-exclude = ["*.md", ".scratch"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long — formatter handles what it can, the rest is fine
    "SIM102", # nested if — often more readable than combined conditions
    "SIM105", # contextlib.suppress — try/except/pass is clearer in scripts
    "SIM108", # ternary — if/else blocks are fine
    "SIM115", # context manager for open — not always applicable
]

[tool.ruff.lint.isort]
known-first-party = ["workflow_gen"]
