[profile.default]
# Drop frogctl's lib unit tests from the default `--all` run (its integration
# tests are already gated behind required-features = ["cli-tests"]); run
# explicitly via `just frogctl-test`.
default-filter = 'not package(frogctl)'
# Mark tests as slow after 5s, terminate after 15s (3 × 5s)
slow-timeout = { period = "5s", terminate-after = 3 }
# Run all tests even if some fail
fail-fast = false
# Each test spawns a multi-shard server consuming ~10+ ephemeral ports.
# macOS has only ~16K ephemeral ports (49152-65535) with 60s TIME_WAIT,
# so high parallelism exhausts the pool (EADDRNOTAVAIL). Cap at 8 threads
# to keep steady-state port usage well under the limit.
test-threads = 8

# Cluster tests spin up multi-node Raft clusters (3-7 nodes each) that are
# CPU- and port-intensive. Limit concurrency so they don't starve each other
# or lighter tests for resources.
[test-groups.cluster]
max-threads = 2

# Cluster integration tests need 5-80s solo and even longer under parallel
# load. Give them 30s slow / 120s hard kill, cap concurrency via test group,
# and allow retries for transient resource-contention failures.
#
# `frogdb-server`'s cluster suite lives in the per-concern `cluster_*` test
# binaries (`tests/cluster_{topology,slots,migration,failover,misc}.rs`), so it
# is selected by binary name, not by module path. The `test(integration_cluster::)`
# arm still covers frogctl's `integration_cluster` module (a `main`-binary
# submodule, reachable via `just frogctl-test`).
[[profile.default.overrides]]
filter = "(package(frogdb-server) & binary(/^cluster_/)) | test(integration_cluster::)"
slow-timeout = { period = "30s", terminate-after = 4 }
test-group = "cluster"
retries = 2

# Replication tests also spin up multi-server topologies and can exceed the
# default 15s timeout under load.
[[profile.default.overrides]]
filter = "test(integration_replication::)"
slow-timeout = { period = "15s", terminate-after = 3 }

# TLS/HTTPS tests wait for the HTTPS listener to start, which can be slow
# on ARM64 CI runners (TLS key generation + listener startup).
[[profile.default.overrides]]
filter = "test(integration_tls_extended::)"
slow-timeout = { period = "15s", terminate-after = 4 }

# Property-based tests (proptest) can be slow, especially on CI runners.
# Give them more headroom to avoid spurious timeouts.
[[profile.default.overrides]]
filter = "test(property_tests::)"
slow-timeout = { period = "15s", terminate-after = 4 }

# The per-PR generated-workload seed sweeps drive ~20 seeded turmoil sims
# back-to-back each, spinning a multi-shard server, running the full invariant
# pipeline, and probing the four DEBUG quiescence commands. That is legitimately
# >15s in debug, so give it generous headroom (the individual sub-runs are fast;
# it is the 20x repetition that accumulates). Excludes `seed_sweep_nightly`
# (below), whose seed count is unbounded and needs its own budget.
[[profile.default.overrides]]
filter = "test(concurrency_workload::seed_sweep) & !test(concurrency_workload::seed_sweep_nightly)"
slow-timeout = { period = "30s", terminate-after = 4 }

# The multi-node cluster turmoil sims (`simulation::test_cluster_*`) bring up a
# real 3-node Raft cluster over the simulated network — leader election, MOVED
# redirect convergence, and (for the partition test) a leader partition held
# across a slot-ownership commit. Re-election plus RocksDB-backed Raft I/O over
# several seeds legitimately exceeds the default 15s hard kill, so give them
# headroom and cap concurrency via the cluster test group.
[[profile.default.overrides]]
filter = "test(simulation::test_cluster_)"
slow-timeout = { period = "30s", terminate-after = 4 }
test-group = "cluster"

# The cluster state-machine property harness (`frogdb-cluster` `properties`
# module). At the default case budget the whole module finishes in well under a
# second. Keep a hard kill — unlike the nightly seed sweep this test also runs
# in the default suite, so a genuine hang must still be caught — but at 4 x 30s
# rather than the default 3 x 5s.
[[profile.default.overrides]]
filter = "package(frogdb-cluster) & test(properties::)"
slow-timeout = { period = "30s", terminate-after = 4 }

# The boosted pass over the same properties, selected by `just cluster-proptest`
# (and therefore by the nightly workflow, which is exactly that recipe). It
# raises `PROPTEST_CASES` by three orders of magnitude, which puts the quadratic
# property (P2 — snapshot restore at every split point, both vehicles) into the
# minutes and takes P3 past the default profile's 120s hard kill. That kill is
# the right budget for a dev-loop run and the wrong one here, so this profile
# marks the properties slow and never terminates them: the real bound is the
# nightly job's `timeout-minutes`, the same rule `seed_sweep_nightly` follows.
# Everything else inherits the default profile unchanged.
[profile.cluster-proptest]

[[profile.cluster-proptest.overrides]]
filter = "package(frogdb-cluster) & test(properties::)"
slow-timeout = { period = "120s" }

# The nightly generated-workload seed sweep (opt-in via `just concurrency-nightly`;
# see concurrency_workload.rs) runs however many seeds x profiles the caller asks
# for via FROGDB_CONCURRENCY_SEEDS, so its runtime is not bounded the way the
# per-PR tier's is. Mark it slow after 60s but never force-terminate it from
# nextest's side — the real time budget is the CI job's `timeout-minutes`.
[[profile.default.overrides]]
filter = "test(concurrency_workload::seed_sweep_nightly)"
slow-timeout = { period = "60s" }

# The full-budget stateright model checks (opt-in via `just model-check`; see
# frogdb-server/crates/cluster/src/model/) enumerate the whole reachable state
# space of the two-phase slot handoff and of the failover composite, driving
# the production state machine once per transition. Each holds several GB of
# visited states and saturates every core, so they get their own
# single-threaded group as well as generous headroom — but no force-terminate,
# because the real budget is the nightly job's `timeout-minutes`. All are
# `#[ignore]`d and so invisible to `just test`; only the bounded-depth smoke
# configs run per commit.
[test-groups.model-check]
max-threads = 1

[[profile.default.overrides]]
filter = "test(model::tests::handoff_model_full) | test(model::failover::tests::failover_model_full)"
slow-timeout = { period = "60s" }
test-group = "model-check"

# The bounded-depth smoke configs of those same models do run per commit, and
# they are not cheap: `failover_model_smoke` enumerates its depth-bounded state
# space in ~10s run alone, which is two thirds of the default 15s hard kill. It
# was killed as TIMEOUT in a run that shared the machine with a `cargo mutants`
# pass, and passed in 10.3s immediately afterwards. Heavy, not hanging — give
# them headroom rather than shrinking the depth bound, which is what the model
# is for.
[[profile.default.overrides]]
filter = "test(model::tests::handoff_model_smoke) | test(model::failover::tests::failover_model_smoke)"
slow-timeout = { period = "30s", terminate-after = 3 }

# HyperLogLog cardinality tests add tens of thousands of elements over the
# socket (sparse→dense promotion + repeated PFCOUNT) and run ~14s in debug —
# right at the default 15s hard kill, so they tip over under parallel load.
# They are legitimately heavy, not flaky: Tier 1/2 write-amplification work
# shrinks per-element persistence cost, but the all-distinct worst case still
# round-trips tens of thousands of elements, so keep generous headroom.
[[profile.default.overrides]]
filter = "test(tcl_pfcount_multiple_keys_merge) | test(tcl_hll_large_element)"
slow-timeout = { period = "30s", terminate-after = 3 }

# SCAN's full-iteration stress test drives a whole keyspace SCAN to completion
# while inserting 50k distinct keys between batches to force griddle resizes
# mid-scan. `scan_filtered` is O(N log N) per call by design (the content-hash
# cursor requires ordering the live keyspace on every batch), so a full drain of
# the resulting 55k-key table costs ~88 sorts of 55k entries — ~3s of pure,
# single-threaded, unoptimized CPU with no I/O and no sleeping. That is inherent
# to the property, not padding: 97% of the time is the product-code scan, and
# the key count is what buys the ~3.5 griddle doublings the test asserts.
#
# This is NOT masking a hang — the test passes in ~2-3s run alone. It gets
# killed only when 8-way `test-threads` parallelism starves it against the
# cluster/turmoil suites, which stretched it past the default 15s hard kill in
# the 2026-08-01 full-suite run. Give it headroom instead of shrinking N.
[[profile.default.overrides]]
filter = "test(scan_full_iteration_survives_resizes_mid_scan)"
slow-timeout = { period = "15s", terminate-after = 3 }

# SDIFF's fuzzing port runs 100 iterations, each building up to 10 sets of up
# to 100 elements apiece (SADD) and then diffing them (SDIFF) — thousands of
# real socket round-trips to the spawned test server. That is fine locally but
# right at the default 15s hard kill on slower CI runners, where it was
# observed to TIMEOUT while the rest of the frozen suite (2300/2301) passed.
# Legitimately heavy, not flaky: give it the same headroom as the HLL
# round-trip-heavy tests above rather than shrinking the fuzz iteration count.
[[profile.default.overrides]]
filter = "test(tcl_sdiff_fuzzing)"
slow-timeout = { period = "30s", terminate-after = 3 }
